<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>to-do app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class = "container mt-5">
    <h1>To-Do App</h1>

    <form action="/add" method="post" class="mt-3">

        <div>
            <label class = "form-label">To-Do Title</label>
            <input type="text" name="title" class="form-control" placeholder="Enter ToDo">
            <br>
            <button type="submit" class="btn btn-primary">Add</button>
        </div>

    </form>

    <hr>
    <ul class="list-group mt-4">
        {% for todo in todo_list %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <p>
                            {{todo.id}} | {{todo.title}}
                        </p>
                    </div>
                    <div class="d-flex align-items-center mt-3">
                        <div class="me-3">
                            {% if todo.complete==False %}
                                <span class="badge bg-warning text-dark px-3 py-2">Not Complete</span>
                            {% else %}
                                <span class="badge bg-success px-3 py-2">Complete</span>
                            {% endif %}
                        </div>

                        <div class="d-flex gap-2">
                            <a href="{{url_for('update', todo_id=todo.id)}}">
                            <button type="button" class="btn btn-success" a href=>Update</button>
                            </a>
                            <a href="{{url_for('delete', todo_id=todo.id)}}">
                            <button type="button" class="btn btn-danger" a href=>Delete</button>
                            </a>
                        </div>
                    </div>
            </li>
        {% endfor %}
    </ul>
</body>
</html>
